  <circle cx="16" cy="16" r="8" fill="none" stroke="#FAF7F4" stroke-width="1.75" opacity="0.85" />
  <ellipse
    cx="16"
    cy="16"
    rx="13"
    ry="4.6"
    fill="none"
    stroke="#E95420"
    stroke-width="2"
    transform="rotate(-20 16 16)"
  />
</svg>
