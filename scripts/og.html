<!doctype html>
<!--
  The social preview card (1200×630). Rendered to public/og.png by
  `npm run og`, because no platform renders HTML or SVG in og:image.
  Same fonts, palette and point cloud as the site.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
        unicode-range: U+0100-024F;
      }
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #edeff2;
        color: #0b0d12;
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      canvas {
        position: absolute;
        inset: 0;
      }

      .copy {
        position: absolute;
        inset: 64px auto 60px 72px;
        display: flex;
        flex-direction: column;
        width: 640px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #4b5263;
        font: 500 20px/1 'Geist Mono', monospace;
      }

      .brand b {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #0b0d12;
        color: #fff;
        font: 600 17px/1 'Bricolage', sans-serif;
        letter-spacing: 0.02em;
      }

      h1 {
        margin-top: auto;
        font: 600 92px/0.95 'Bricolage', sans-serif;
        font-variation-settings: 'opsz' 96, 'wdth' 92;
        letter-spacing: -0.045em;
      }

      p {
        margin-top: 22px;
        font: 600 44px/1.05 'Bricolage', sans-serif;
        letter-spacing: -0.035em;
      }

      p em {
        font-style: normal;
        background: linear-gradient(100deg, #440154 0%, #3b528b 35%, #21918c 70%, #5ec962 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .stack {
        margin-top: auto;
        color: #8a90a0;
        font: 500 19px/1 'Geist Mono', monospace;
      }

      .portrait {
        position: absolute;
        top: 165px;
        left: 830px;
        width: 300px;
        height: 300px;
        padding: 8px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(11, 13, 18, 0.06), 0 30px 60px -24px rgba(11, 13, 18, 0.35);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 22%;
      }
    </style>
  </head>
  <body>
    <canvas id="cloud" width="2400" height="1260" style="width: 1200px; height: 630px"></canvas>

    <div class="copy">
      <div class="brand"><b>PW</b>pawelvlodarczyk.pl</div>
      <h1>Paweł<br />Włodarczyk</h1>
      <p>I put AI into <em>production.</em></p>
      <div class="stack">Full-stack · ML · LLMs · RAG · Python · React</div>
    </div>

    <div class="portrait"><img src="../public/portrait.webp" alt="" /></div>

    <script>
      // The hero's point cloud, frozen at one angle: project clusters in viridis,
      // each point joined to its nearest neighbour.
      const VIRIDIS = ['#440154', '#46327e', '#365c8d', '#277f8e', '#1fa187', '#4ac16d', '#a0da39'];
      let seed = 1997;
      const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      const gauss = () => Math.sqrt(-2 * Math.log(Math.max(rand(), 1e-9))) * Math.cos(2 * Math.PI * rand());

      const ctx = document.getElementById('cloud').getContext('2d');
      ctx.scale(2, 2);
      const cx = 980, cy = 315, R = 300;
      const points = [];

      VIRIDIS.forEach((colour, i) => {
        const t = (i + 0.5) / VIRIDIS.length;
        const phi = Math.acos(1 - 2 * t);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i + 0.6;
        const c = { x: Math.sin(phi) * Math.cos(theta), y: Math.cos(phi) * 0.85, z: Math.sin(phi) * Math.sin(theta) };
        for (let n = 0; n < 46; n += 1) {
          points.push({ x: c.x + gauss() * 0.16, y: c.y + gauss() * 0.16, z: c.z + gauss() * 0.16, colour, k: i });
        }
      });
      for (let n = 0; n < 160; n += 1) {
        const r = 1.35 * Math.cbrt(rand()), ph = Math.acos(2 * rand() - 1), th = rand() * Math.PI * 2;
        points.push({ x: r * Math.sin(ph) * Math.cos(th), y: r * Math.cos(ph) * 0.85, z: r * Math.sin(ph) * Math.sin(th), colour: '#8a90a0', k: -1 });
      }

      const project = (p) => {
        const f = 3.4 / (3.4 + p.z);
        return { sx: cx + p.x * R * f, sy: cy + p.y * R * f, depth: Math.min(1, Math.max(0, (1.6 - p.z) / 3.2)), f };
      };
      const proj = points.map(project);
      const rgba = (hex, a) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      ctx.lineWidth = 1;
      points.forEach((p, i) => {
        if (p.k < 0) return;
        let best = -1, bestD = Infinity;
        points.forEach((q, j) => {
          if (i === j || q.k !== p.k) return;
          const d = (p.x - q.x) ** 2 + (p.y - q.y) ** 2 + (p.z - q.z) ** 2;
          if (d < bestD) { bestD = d; best = j; }
        });
        const a = proj[i], b = proj[best];
        ctx.strokeStyle = rgba(p.colour, 0.22 * (0.4 + a.depth * 0.6));
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
      });

      proj
        .map((p, i) => ({ ...p, pt: points[i] }))
        .sort((a, b) => a.depth - b.depth)
        .forEach(({ sx, sy, depth, f, pt }) => {
          ctx.fillStyle = rgba(pt.colour, (pt.k < 0 ? 0.35 : 0.85) * (0.25 + depth * 0.75));
          ctx.beginPath();
          ctx.arc(sx, sy, (1.4 + rand() * 1.6) * f, 0, Math.PI * 2);
          ctx.fill();
        });

      document.fonts.ready.then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
</html>
