<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paweł Włodarczyk — The Engineer's Codex</title>
    <meta
      name="description"
      content="Production systems built with an instrument-maker's care — Python & FastAPI below the waterline, React & Next.js above it, applied machine learning throughout."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAF7F4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Sharing card. og:image must be an absolute URL, so it carries the
      deployed origin: change all four URLs below if the folio moves off
      GitHub Pages. Regenerate the image with `npm run og`.
      The card is set in English — it is what a stranger sees before choosing
      a language.
    -->
    <link rel="canonical" href="https://empios.github.io/personal-portfolio/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://empios.github.io/personal-portfolio/" />
    <meta property="og:site_name" content="The Engineer's Codex" />
    <meta property="og:title" content="Paweł Włodarczyk — The Engineer's Codex" />
    <meta
      property="og:description"
      content="Production systems built with an instrument-maker's care — Python & FastAPI below the waterline, React & Next.js above it, applied machine learning throughout."
    />
    <meta property="og:image" content="https://empios.github.io/personal-portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Engineer's Codex — Paweł Włodarczyk, full-stack software engineer, set beside an armillary sphere."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Ubuntu Sans / Ubuntu Sans Mono are loaded by Pangolin's base.css.
         The folio adds only the display serif it introduces on top of the system. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
